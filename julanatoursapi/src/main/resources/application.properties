# Application Configuration
spring.application.name=julanatoursapi
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/vehicledb
spring.data.mongodb.database=vehicledb

# JWT Configuration
jwt.secret.key=mySecretKeyForJulanaToursApplicationThatIsVeryLongAndSecure
jwt.expiration=604800000

# AWS S3 Configuration (Optional - comment out if not using S3)
aws.access.key=${AWS_ACCESS_KEY:dummy}
aws.secret.key=${AWS_SECRET_KEY:dummy}
aws.region=ap-south-1
aws.s3.bucketname=${AWS_S3_BUCKETNAME:dummy}

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:5174
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging Configuration
logging.level.in.luckyseven.julanatoursapi=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always